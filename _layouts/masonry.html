---
layout: "wrapper"
---

<script src="https://unpkg.com/imagesloaded@5/imagesloaded.pkgd.min.js"></script>
<script src="https://unpkg.com/masonry-layout@4/dist/masonry.pkgd.min.js"></script>

<style>
  .load-more-container {
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 3rem 0;
    min-height: 50px;
  }

  #load-more-btn {
    background-color: var(--heading-color);
    font-family: var(--font); 
    border-radius: 20px; 
    border: 1px solid var(--heading-color);
    font-weight: 600;
    padding: 10px 24px;
    cursor: pointer;
  }

  #load-more-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }
</style>

{{ content }}

<div class="load-more-container">
  <button id="load-more-btn" type="button">Show More</button>
</div>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    const BATCH_SIZE = 10;
    const grid = document.querySelector('#masonry-grid');
    const loadMoreBtn = document.getElementById('load-more-btn');

    if (!grid || !loadMoreBtn) return;

    const totalPosts = parseInt(grid.dataset.total || "0", 10);
    let currentIndex = parseInt(grid.dataset.initial || "10", 10);
    let cachedJson = null;

    // Hide button immediately if total items <= initial load
    if (totalPosts <= currentIndex) {
      loadMoreBtn.style.display = 'none';
    }

    const msnry = new Masonry(grid, {
      itemSelector: '.grid-item',
      percentPosition: true,
      gutter: 16
    });

    imagesLoaded(grid).on('progress', function() {
      msnry.layout();
    });

    loadMoreBtn.addEventListener('click', async function() {
      loadMoreBtn.disabled = true;
      loadMoreBtn.textContent = 'Loading...';

      try {
        // Fetch JSON endpoint once on first click and cache in memory
        if (!cachedJson) {
          const res = await fetch('{{ "/fanart.json" | relative_url }}');
          if (!res.ok) throw new Error('Failed to fetch fanart JSON');
          cachedJson = await res.json();
        }

        const nextBatch = cachedJson.slice(currentIndex, currentIndex + BATCH_SIZE);
        if (!nextBatch.length) {
          loadMoreBtn.style.display = 'none';
          return;
        }

        const fragment = document.createDocumentFragment();
        const newNodes = [];

        nextBatch.forEach(post => {
          const item = document.createElement('div');
          item.className = 'grid-item rkgk';
          item.innerHTML = `
            <header class="time">${post.date}</header>
            <div class="post-content">${post.content}</div>
          `;
          fragment.appendChild(item);
          newNodes.push(item);
        });

        grid.appendChild(fragment);
        msnry.appended(newNodes);

        imagesLoaded(newNodes, function() {
          msnry.layout();
        });

        currentIndex += nextBatch.length;

        if (currentIndex >= cachedJson.length) {
          loadMoreBtn.style.display = 'none';
        } else {
          loadMoreBtn.textContent = 'Show More';
          loadMoreBtn.disabled = false;
        }
      } catch (err) {
        console.error(err);
        loadMoreBtn.textContent = 'Failed to load';
        loadMoreBtn.disabled = false;
      }
    });
  });
</script>
