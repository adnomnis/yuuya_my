---
layout: "wrapper"
---

<script src="https://unpkg.com/imagesloaded@5/imagesloaded.pkgd.min.js"></script>
<script src="https://unpkg.com/masonry-layout@4/dist/masonry.pkgd.min.js"></script>

<style>
  .load-more-container {
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 3rem 0;
    min-height: 50px;
  }

  #load-more-btn {
    background-color: var(--heading-color);
    font-family: var(--font); 
    border-radius: 20px; 
    border: 1px solid var(--heading-color);
    font-weight: 600;
    padding: 10px 24px;
    cursor: pointer;
  }

  #load-more-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }
</style>

{{ content }}

<div class="load-more-container">
  <button id="load-more-btn" type="button">Show More</button>
</div>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    const BATCH_SIZE = 10;
    const grid = document.querySelector('#masonry-grid');
    const loadMoreBtn = document.getElementById('load-more-btn');

    if (!grid || !loadMoreBtn) return;

    const totalPosts = parseInt(grid.dataset.total || "0", 10);
    let currentIndex = parseInt(grid.dataset.initial || "10", 10);
    let cachedJson = null;

    const jsonUrl = grid.dataset.json || '{{ page.json_url | default: "/fanart.json" | relative_url }}';

    if (totalPosts <= currentIndex) {
      loadMoreBtn.style.display = 'none';
    }

    const msnry = new Masonry(grid, {
      itemSelector: '.grid-item',
      percentPosition: true,
      gutter: 16
    });

    imagesLoaded(grid).on('progress', function() {
      msnry.layout();
    });

    // Preloads images for a DOM element sequentially to prevent out-of-order pop-in
    async function preloadImages(container) {
      const imgs = Array.from(container.querySelectorAll('img'));
      for (const img of imgs) {
        if (img.complete) continue;
        await new Promise((resolve) => {
          const temp = new Image();
          temp.onload = temp.onerror = resolve; // Continue even if an image breaks
          temp.src = img.src;
        });
      }
    }

    loadMoreBtn.addEventListener('click', async function() {
      loadMoreBtn.disabled = true;
      loadMoreBtn.textContent = 'Loading...';

      try {
        if (!cachedJson) {
          const res = await fetch(jsonUrl);
          if (!res.ok) throw new Error(`Failed to fetch JSON from ${jsonUrl}`);
          cachedJson = await res.json();
        }

        const nextBatch = cachedJson.slice(currentIndex, currentIndex + BATCH_SIZE);
        if (!nextBatch.length) {
          loadMoreBtn.style.display = 'none';
          return;
        }

        // Process sequentially: 1st -> 2nd -> ... -> 10th
        for (const post of nextBatch) {
          const item = document.createElement('div');
          item.className = post.class ? `grid-item rkgk ${post.class}` : 'grid-item rkgk';
          item.innerHTML = `
            <header class="time">${post.date}</header>
            <div class="post-content">${post.content}</div>
          `;

          // Force browser to fetch and decode this post's images before rendering
          await preloadImages(item);

          // Append and position item by item in exact array order
          grid.appendChild(item);
          msnry.appended([item]);
          msnry.layout();
        }

        currentIndex += nextBatch.length;

        if (currentIndex >= cachedJson.length) {
          loadMoreBtn.style.display = 'none';
        } else {
          loadMoreBtn.textContent = 'Show More';
          loadMoreBtn.disabled = false;
        }
      } catch (err) {
        console.error(err);
        loadMoreBtn.textContent = 'Failed to load';
        loadMoreBtn.disabled = false;
      }
    });
  });
</script>
